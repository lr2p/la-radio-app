# Construit l'app et la publie sur GitHub Pages.
# Déclenché à chaque push sur main, et toutes les deux heures pour rafraîchir la
# liste des vidéos YouTube (scripts/videos.mjs) — la mémoire data/videos.json est
# recommitée quand elle change. Une vidéo publiée sur la chaîne est donc dans l'app
# au plus tard deux heures après (le planificateur de GitHub prend son temps : une
# minute impaire et peu courue lui évite les heures de pointe).
# Le studio de Marvin sonne aussi ce dépôt (`repository_dispatch` de type `video`, avec
# l'id de la vidéo) au moment où Leeroy y colle le lien YouTube d'un film : l'app est alors
# à jour dans la minute, sans attendre le prochain passage.
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
  repository_dispatch:
    types: [video]
  workflow_dispatch:
    inputs:
      video:
        description: 'URL ou id YouTube à recenser sans attendre le flux RSS (facultatif)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recenser les vidéos YouTube
        # La vidéo nommée (sonnerie du studio ou lancement à la main) est lue directement
        # sur sa page : le flux RSS met parfois du temps à voir une publication fraîche.
        # Passée par l'environnement, jamais interpolée dans la commande : ce qui arrive
        # par la sonnerie est une donnée, pas du shell.
        env:
          VIDEO: ${{ github.event.client_payload.video || inputs.video }}
        run: node scripts/videos.mjs $VIDEO
      - name: Mémoriser le recensement
        run: |
          if ! git diff --quiet -- data/videos.json; then
            git config user.name "la-radio-app bot"
            git config user.email "bot@la-radio.ai"
            git add data/videos.json
            git commit -m "vidéos : recensement du $(date -u +%Y-%m-%d)"
            git push
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
